<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI GUSTAVE - Polyvalent</title>
<style>
*{box-sizing:border-box}
body{font-family:Arial,sans-serif;background:#e8eef7;margin:0;padding:8px}
.box{max-width:750px;margin:auto;background:white;border-radius:18px;padding:14px;box-shadow:0 4px 20px rgba(0,0,0,0.1)}
.top{text-align:center}
.top h1{color:#1a73e8;font-size:24px;margin:5px 0}
.top p{color:#555;margin:0;font-size:14px}
.badge{background:#e6f4ea;color:#137333;padding:8px;border-radius:10px;text-align:center;font-weight:bold;margin:12px 0;font-size:13px}
#chat{background:#fafafa;border:1px solid #ddd;height:440px;overflow-y:auto;padding:10px;border-radius:12px;margin-bottom:10px}
.msg{margin-bottom:10px;padding:11px 12px;border-radius:12px;max-width:92%;white-space:pre-wrap;line-height:1.6;font-size:14.5px}
.user{background:#d3e3fd;margin-left:auto;text-align:right}
.ai{background:#e6f4ea}
img.preview{max-width:100%;border-radius:10px;margin-top:5px}
.exemples{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.exemples button{background:#f1f3f4;border:1px solid #ddd;padding:7px 10px;border-radius:20px;font-size:12px;cursor:pointer}
.inputrow{display:flex;gap:6px}
.inputrow input{flex:1;padding:13px;border:1px solid #ccc;border-radius:12px;font-size:15px}
.inputrow button{padding:13px 15px;border:none;border-radius:12px;color:white;font-weight:bold;cursor:pointer}
#sendBtn{background:#1a73e8}
#photoBtn{background:#34a853}
#clearBtn{background:#ea4335;width:100%;margin-top:8px;padding:11px;color:white;border:none;border-radius:10px;font-weight:bold}
small{color:#777}
.typing{font-style:italic;color:#777}
</style>
</head>
<body>
<div class="box">
<div class="top">
<h1>🤖 AI GUSTAVE</h1>
<p>Polyvalent - Pose-moi n'importe quelle question, je t'aide</p>
</div>
<div class="badge">✅ Branché - Pas besoin de clé - Répond à tout</div>

<div id="chat"></div>

<div class="exemples">
<button onclick="exemple('Explique-moi la multiplication avec un exemple simple')">➗ Multiplication</button>
<button onclick="exemple('Donne-moi une idée de business avec petit budget en Afrique')">💰 Idée business</button>
<button onclick="exemple('Comment faire un bon CV ?')">📄 CV</button>
<button onclick="exemple('C’est quoi la photosynthèse ?')">🌱 Photosynthèse</button>
<button onclick="exemple('Aide-moi à écrire un message pour vendre mon produit')">🛍️ Vendre</button>
<button onclick="exemple('Comment apprendre l’anglais rapidement ?')">🇬🇧 Anglais</button>
</div>

<div class="inputrow">
<input type="text" id="question" placeholder="Pose n'importe quelle question ici...">
<button id="sendBtn" onclick="envoyer()">Envoyer</button>
<button id="photoBtn" onclick="document.getElementById('photoInput').click()">📷 Photo</button>
</div>
<input type="file" id="photoInput" accept="image/*" style="display:none" onchange="envoyerPhoto(this)">
<button id="clearBtn" onclick="effacerChat()">Effacer la conversation</button>
<br><br>
<small>Tu peux demander : cours, devoirs, business, téléphone, idées, messages, CV, traductions, tout.</small>
</div>

<script>
let historique = JSON.parse(localStorage.getItem("gustave_chat") || "[]");
function sauvegarder(){
  localStorage.setItem("gustave_chat", JSON.stringify(historique.slice(-40)));
}
function ajouterMessage(texte, type, sauver=true){
  let chat = document.getElementById("chat");
  let div = document.createElement("div");
  div.className = "msg " + type;
  div.innerText = texte;
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
  if(sauver){ historique.push({t:texte, type:type}); sauvegarder(); }
  return div;
}
function charger(){
  if(historique.length===0){
    ajouterMessage("Bonjour ! Je suis AI GUSTAVE, polyvalent. Tu peux me demander TOUT : les cours, les devoirs, le business, comment vendre, comment écrire un CV, comment utiliser ton téléphone, des idées, des traductions, des conseils. Je t'explique en français simple, étape par étape, avec des exemples. Pose ta question !", "ai", false);
  } else {
    historique.forEach(h=> ajouterMessage(h.t, h.type, false));
  }
}
charger();
function effacerChat(){
  historique = [];
  localStorage.removeItem("gustave_chat");
  document.getElementById("chat").innerHTML = "";
  ajouterMessage("Conversation effacée. Pose une nouvelle question !", "ai", false);
}
function exemple(texte){
  document.getElementById("question").value = texte;
  envoyer();
}
async function envoyer(){
  let input = document.getElementById("question");
  let q = input.value.trim();
  if(!q) return;
  ajouterMessage(q, "user");
  input.value = "";
  let attente = ajouterMessage("AI GUSTAVE écrit...", "ai", false);
  attente.classList.add("typing");

  let prompt = "Tu es AI GUSTAVE, un assistant polyvalent comme Meta AI, intelligent, gentil, patient, qui sait tout faire. Tu réponds à TOUTES les questions : école, devoirs, maths, français, sciences, histoire, business, vente, marketing, CV, lettres, messages, téléphone, informatique, idées, conseils de vie, traductions, santé générale, cuisine, sport. Tu parles en français simple, clair, étape par étape quand il faut expliquer. Tu dis toujours la vérité. Tu ne dis jamais seulement 'je ne sais pas'. Si tu ne connais pas une chose, tu dis ce que tu sais, tu donnes un exemple, tu proposes une solution et une autre façon de comprendre. Tu t'adaptes : si c'est une question d'école, tu expliques comme un prof. Si c'est du business, tu donnes un plan concret. Si c'est une demande d'écrire un texte, tu écris le texte complet, prêt à copier. Structure ta réponse avec des titres, des étapes numérotées et des exemples. À la fin, demande : 'Tu as compris ? Tu veux que j'explique encore plus simplement ou que je te donne un autre exemple ?' Question de l'utilisateur : " + q;

  try{
    let url = "https://text.pollinations.ai/" + encodeURIComponent(prompt) + "?model=openai";
    let res = await fetch(url);
    let texte = await res.text();
    attente.classList.remove("typing");
    attente.innerText = texte;
    historique.push({t:texte, type:"ai"}); sauvegarder();
  }catch(e){
    attente.innerText = "Problème de connexion. Vérifie ton internet et réessaie.";
  }
}
async function envoyerPhoto(inputFile){
  let file = inputFile.files[0];
  if(!file) return;
  let reader = new FileReader();
  reader.onload = function(e){
    ajouterMessage("📷 Photo envoyée", "user");
    let chat = document.getElementById("chat");
    let img = document.createElement("img");
    img.src = e.target.result;
    img.className = "preview";
    chat.appendChild(img);
    chat.scrollTop = chat.scrollHeight;
    ajouterMessage("J'ai bien reçu ta photo. Maintenant écris-moi en bas ce qui est écrit dessus, ou ce que tu veux que je fasse avec. Par exemple : 'Explique-moi cet exercice' ou 'Traduis ce texte' ou 'Aide-moi à répondre'.", "ai");
  };
  reader.readAsDataURL(file);
}
document.getElementById("question").addEventListener("keypress", function(e){
  if(e.key === "Enter"){ envoyer(); }
});
</script>
</body>
</html>
